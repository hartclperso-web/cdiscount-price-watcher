name: Surveillance prix Cdiscount

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verifier les prix
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python check_prices.py

      - name: Sauvegarder l'etat (anti-spam)
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add state.json
            git commit -m "maj etat alertes [skip ci]"
            git push
          else
            echo "Aucun changement d'etat."
          fi
